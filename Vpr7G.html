                let score = 0;
                let allCorrect = true;
                if (!appState.userProgress[id]) {
                    appState.userProgress[id] = { answers: {}, score: 0 };
                }

                // Validate
                Object.keys(task.questions).forEach(key => {
                    const userAns = progress.answers[key];
                    const correctAns = task.questions[key].ans;
                    const gapEl = document.getElementById(`gap-${key}`);
                    const group = document.getElementById(`group-${key}`);

                    // Reset styling
                    gapEl.classList.remove('correct', 'incorrect');
                    
                    if (userAns === correctAns) {
                        score++;
                        gapEl.classList.add('correct');
                        // Add checkmark to option group
                    } else {
                        allCorrect = false;
                        gapEl.classList.add('incorrect');
                    }
                });

                // Save Score
                appState.userProgress[id].score = score;
                app.saveProgress();
                app.renderSidebar(); // Update sidebar tick

                // Show Feedback
                feedback.classList.remove('hidden');
                if (allCorrect) {
                    feedback.innerHTML = `
                        <div class="bg-green-100 text-green-800 p-3 rounded-lg font-bold border border-green-200">
                            🎉 Perfect! 5/5 Correct.
                        </div>
                    `;
                } else {
                    appState.lives = Math.max(0, appState.lives - 1);
                    let extraMessage = `<span class="text-xs font-normal">Lives left: ${appState.lives}/${appState.maxLives}. Review the red items and try again!</span>`;

                    if (appState.lives === 0) {
                        const resetLevels = app.resetPreviousLevels(id);
                        extraMessage = `<span class="text-xs font-normal">Ты использовала все жизни. Начинай заново с уровней: ${resetLevels.sort((a, b) => a - b).join(', ') || '1'}. Жизни восстановлены до ${appState.maxLives}.</span>`;
                    } else {
                        app.saveProgress();
                    }

                    feedback.innerHTML = `
                        <div class="bg-amber-100 text-amber-800 p-3 rounded-lg font-bold border border-amber-200">
                            You got ${score}/5 correct. <br> ${extraMessage}
                        </div>
                    `;
                }
            }
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', app.init);

    </script>
</body>
</html>
